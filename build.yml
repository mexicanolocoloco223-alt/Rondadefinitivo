      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Compilar
        run: cd proj && gradle assembleDebug --no-daemon
      - name: Publicar APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Rondas INPLAVEL APK ${{ github.run_number }}
          files: proj/app/build/outputs/apk/debug/app-debug.apk
